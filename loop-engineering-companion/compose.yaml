services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loop_engineering
      POSTGRES_USER: loop_test
      POSTGRES_PASSWORD: loop_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop_test -d loop_engineering"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
