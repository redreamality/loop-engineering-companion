[project]
name = "loop-engineering-companion"
version = "0.1.0"
description = "Executable companion examples for Loop Engineering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.9,<4",
    "pydantic>=2.11.7,<3",
    "tzdata>=2025.2",
]

[project.scripts]
daily-plan-loop = "loop_engineering_companion.daily_plan:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loop_engineering_companion"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
